<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Donut Crush | Owner Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --pink:#f28aa6;
  --pink2:#ffe8ef;
  --cream:#fffaf7;
  --brown:#432b29;
  --muted:#927875;
  --line:#f0e3df;
  --white:#fff;
  --danger:#d9566d;
  --green:#39a56f
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--cream);
  color:var(--brown);
  font-family:Tahoma,Arial,sans-serif
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}

.container{
  width:min(1120px,calc(100% - 28px));
  margin:auto
}

.hidden{display:none!important}

/* LOGIN */

.login-page{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px
}

.login-box{
  width:min(420px,100%);
  background:#fff;
  border:1px solid var(--line);
  border-radius:25px;
  padding:30px;
  box-shadow:0 20px 60px #5a322b12
}

.logo{
  width:58px;
  height:58px;
  border-radius:18px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#ffb6c9,#ef7295);
  font-size:30px;
  margin:0 auto 15px
}

.login-box h1{
  text-align:center;
  margin:0 0 7px;
  font-size:24px
}

.login-box>p{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin:0 0 25px
}

.field{
  margin-bottom:13px
}

.field label{
  display:block;
  font-size:11px;
  color:#806d68;
  margin-bottom:6px
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid var(--line);
  border-radius:11px;
  padding:12px;
  outline:0;
  background:#fff;
  color:var(--brown)
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:#f4a5b9;
  box-shadow:0 0 0 3px var(--pink2)
}

.submit{
  width:100%;
  height:46px;
  border:0;
  border-radius:13px;
  background:var(--pink);
  color:#fff;
  font-weight:bold
}

.submit:disabled{
  opacity:.7;
  cursor:not-allowed
}

.error{
  color:var(--danger);
  font-size:11px;
  text-align:center;
  min-height:18px;
  margin:10px 0
}

/* DASHBOARD */

header{
  background:#fff;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:20
}

.nav{
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900
}

.brand-logo{
  width:42px;
  height:42px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:var(--pink2);
  font-size:22px
}

.owner{
  display:flex;
  align-items:center;
  gap:10px
}

.owner-name{
  font-size:10px;
  color:var(--muted)
}

.logout{
  border:1px solid var(--line);
  background:#fff;
  color:var(--danger);
  border-radius:11px;
  padding:9px 12px;
  font-size:10px;
  font-weight:bold
}

main{
  padding:30px 0 60px
}

.top{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px
}

.top h1{
  margin:0;
  font-size:28px
}

.top p{
  margin:7px 0 0;
  color:var(--muted);
  font-size:11px
}

.add-btn{
  border:0;
  background:var(--pink);
  color:#fff;
  border-radius:12px;
  padding:12px 17px;
  font-weight:bold;
  font-size:11px
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-bottom:20px
}

.stat{
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  padding:16px
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-bottom:7px
}

.stat b{
  font-size:22px
}

.products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:19px;
  overflow:hidden;
  display:flex;
  flex-direction:column
}

.pic{
  height:190px;
  background:linear-gradient(135deg,#ffe1e9,#fff0df);
  display:grid;
  place-items:center;
  overflow:hidden;
  position:relative
}

.pic img{
  width:100%;
  height:100%;
  object-fit:cover
}

.emoji{
  font-size:65px
}

.status{
  position:absolute;
  top:10px;
  right:10px;
  padding:6px 9px;
  border-radius:20px;
  font-size:9px;
  font-weight:bold;
  background:#e7f8ef;
  color:#27845b
}

.status.off{
  background:#fcebed;
  color:var(--danger)
}

.info{
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:7px;
  flex:1
}

.info h3{
  margin:0;
  font-size:15px
}

.desc{
  margin:0;
  color:var(--muted);
  font-size:10px;
  line-height:1.7;
  min-height:34px
}

.meta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:auto;
  padding-top:7px
}

.price{
  font-weight:900;
  color:#df5e80;
  font-size:15px
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:9px
}

.edit,
.delete{
  border:0;
  border-radius:10px;
  padding:9px;
  font-size:10px;
  font-weight:bold
}

.edit{
  background:var(--pink2);
  color:#d65d7b
}

.delete{
  background:#fcebed;
  color:var(--danger)
}

.empty{
  grid-column:1/-1;
  text-align:center;
  background:#fff;
  border:1px dashed #e9d5d0;
  border-radius:18px;
  padding:55px;
  color:var(--muted);
  font-size:12px
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:#2e1c1b88;
  z-index:50;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px
}

.modal.show{
  display:flex
}

.modal-box{
  width:min(560px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:23px;
  padding:22px
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px
}

.modal-head h2{
  margin:0;
  font-size:19px
}

.close{
  border:0;
  background:#f7eeee;
  width:35px;
  height:35px;
  border-radius:10px
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.full{
  grid-column:1/-1
}

.check{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:11px;
  color:var(--muted);
  margin:5px 0 13px
}

.check input{
  width:auto
}

.new-category{
  margin-top:8px
}

.toast{
  position:fixed;
  bottom:20px;
  right:20px;
  z-index:100;
  background:var(--brown);
  color:#fff;
  padding:12px 17px;
  border-radius:12px;
  font-size:11px;
  opacity:0;
  transform:translateY(10px);
  transition:.2s
}

.toast.show{
  opacity:1;
  transform:none
}

/* ORDERS */

.orders-section{
  margin-top:30px;
}

.orders-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:15px;
  margin-bottom:15px;
}

.orders-head h2{
  margin:0;
  font-size:22px
}

.orders-head p{
  margin:6px 0 0;
  color:var(--muted);
  font-size:11px
}

.refresh-orders{
  border:1px solid var(--line);
  background:#fff;
  color:var(--brown);
  border-radius:11px;
  padding:9px 12px;
  font-size:10px;
  font-weight:bold
}

.orders{
  display:grid;
  gap:12px
}

.order-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  padding:15px
}

.order-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px
}

.order-number{
  font-weight:900;
  font-size:15px
}

.order-date{
  color:var(--muted);
  font-size:9px;
  margin-top:4px
}

.order-status{
  border:0;
  border-radius:20px;
  padding:6px 10px;
  font-size:9px;
  font-weight:bold;
  background:#fff2d8;
  color:#9a6818
}

.order-status.done{
  background:#e7f8ef;
  color:#27845b
}

.order-status.cancelled{
  background:#fcebed;
  color:var(--danger)
}

.order-body{
  display:grid;
  grid-template-columns:1.2fr 1fr 1fr;
  gap:14px;
  margin-top:14px
}

.order-label{
  font-size:9px;
  color:var(--muted);
  margin-bottom:5px
}

.order-value{
  font-size:11px;
  line-height:1.7;
  word-break:break-word
}

.order-items{
  margin-top:12px;
  border-top:1px solid var(--line);
  padding-top:11px
}

.order-item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:10px;
  padding:4px 0
}

.order-total{
  display:flex;
  justify-content:space-between;
  margin-top:9px;
  padding-top:9px;
  border-top:1px dashed var(--line);
  font-weight:900;
  color:#df5e80
}

.order-actions{
  display:flex;
  gap:8px;
  margin-top:12px
}

.order-actions select{
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px 10px;
  background:#fff;
  color:var(--brown);
  font-size:10px
}

.order-actions button{
  border:0;
  border-radius:10px;
  padding:8px 12px;
  background:var(--pink2);
  color:#d65d7b;
  font-size:10px;
  font-weight:bold
}

@media(max-width:850px){

  .products{
    grid-template-columns:repeat(2,1fr)
  }

  .order-body{
    grid-template-columns:1fr 1fr
  }
}

@media(max-width:600px){

  .container{
    width:min(100% - 20px,1120px)
  }

  .owner-name{
    display:none
  }

  .top{
    align-items:stretch;
    flex-direction:column
  }

  .add-btn{
    width:100%
  }

  .products{
    grid-template-columns:1fr
  }

  .stats{
    grid-template-columns:1fr 1fr
  }

  .form-grid{
    grid-template-columns:1fr
  }

  .order-body{
    grid-template-columns:1fr
  }

  .orders-head{
    align-items:stretch;
    flex-direction:column
  }

  .refresh-orders{
    width:100%
  }

  .full{
    grid-column:auto
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="loginPage" class="login-page">

  <div class="login-box">

    <div class="logo">🍩</div>

    <h1>Donut Crush</h1>

    <p>Owner Dashboard — تسجيل دخول المالك</p>

    <form id="loginForm">

      <div class="field">

        <label>اسم المستخدم</label>

        <input
          id="loginUsername"
          type="text"
          autocomplete="username"
          required
          placeholder="crush.time"
        >

      </div>

      <div class="field">

        <label>كلمة المرور</label>

        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          required
          placeholder="••••••••"
        >

      </div>

      <div id="loginError" class="error"></div>

      <button class="submit" type="submit">
        دخول لوحة التحكم
      </button>

    </form>

  </div>

</section>


<!-- DASHBOARD -->

<div id="dashboardPage" class="hidden">

<header>

  <div class="container nav">

    <div class="brand">

      <span class="brand-logo">🍩</span>

      Donut Crush Dashboard

    </div>

    <div class="owner">

      <span id="ownerName" class="owner-name">
        crush.time
      </span>

      <button class="logout" onclick="logout()">
        تسجيل الخروج
      </button>

    </div>

  </div>

</header>


<main>

  <div class="container">

    <div class="top">

      <div>

        <h1>إدارة المنتجات</h1>

        <p>
          إضافة وتعديل وحذف المنتجات من قاعدة البيانات.
        </p>

      </div>

      <button class="add-btn" onclick="openAdd()">
        ＋ إضافة منتج
      </button>

    </div>


    <div class="stats">

      <div class="stat">

        <span>إجمالي المنتجات</span>

        <b id="totalProducts">0</b>

      </div>

      <div class="stat">

        <span>المنتجات المتاحة</span>

        <b id="availableProducts">0</b>

      </div>

    </div>


    <div id="products" class="products"></div>


    <section class="orders-section">

      <div class="orders-head">

        <div>

          <h2>الطلبات 📦</h2>

          <p>
            الأوردرات الجديدة بتظهر هنا تلقائيًا.
          </p>

        </div>

        <button
          class="refresh-orders"
          onclick="loadOrders()"
        >
          ↻ تحديث الطلبات
        </button>

      </div>

      <div id="orders" class="orders"></div>

    </section>

  </div>

</main>

</div>


<!-- PRODUCT MODAL -->

<div id="productModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modalTitle">
        إضافة منتج
      </h2>

      <button class="close" onclick="closeModal()">
        ✕
      </button>

    </div>


    <form id="productForm">

      <input
        id="productId"
        type="hidden"
      >


      <div class="form-grid">

        <div class="field">

          <label>اسم المنتج *</label>

          <input
            id="productName"
            required
            maxlength="100"
            placeholder="Chocolate Donut"
          >

        </div>


        <div class="field">

          <label>السعر *</label>

          <input
            id="productPrice"
            type="number"
            min="0"
            step="0.01"
            required
            placeholder="50"
          >

        </div>


        <div class="field full">

          <label>الوصف</label>

          <textarea
            id="productDescription"
            maxlength="300"
            placeholder="وصف المنتج"
          ></textarea>

        </div>


        <!-- IMAGE UPLOAD -->

        <div class="field">

          <label>صورة المنتج</label>

          <input
            id="productImageFile"
            type="file"
            accept="image/*"
          >

          <!-- يحتفظ برابط الصورة في حالة تعديل منتج قديم -->

          <input
            id="productImage"
            type="hidden"
          >

          <div
            id="productImagePreview"
            style="
              margin-top:8px;
              display:none
            "
          ></div>

        </div>


        <!-- CATEGORY -->

        <div class="field">

          <label>التصنيف</label>

          <select id="productCategory">

            <option value="">
              اختر التصنيف
            </option>

            <option value="__new__">
              ➕ إضافة تصنيف جديد
            </option>

          </select>

          <input
            id="newProductCategory"
            class="new-category"
            maxlength="60"
            placeholder="اكتب اسم التصنيف الجديد"
            style="display:none"
          >

        </div>

      </div>


      <label class="check">

        <input
          id="productAvailable"
          type="checkbox"
          checked
        >

        المنتج متاح للعميل

      </label>


      <button
        id="saveProduct"
        class="submit"
        type="submit"
      >
        حفظ المنتج
      </button>

    </form>

  </div>

</div>


<div id="toast" class="toast"></div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://euvcfvsejcsoympamjub.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_hct8gjRVMCj2L59vI46Yag_VuXReOdU";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   OWNER LOGIN
========================= */

const OWNER_USERNAME = "crush.time";

const OWNER_PASSWORD = "choco.donut";


/* =========================
   VARIABLES
========================= */

let products = [];

let orders = [];

let categories = [];


/* =========================
   HELPERS
========================= */

const $ = id =>
  document.getElementById(id);


const esc = x =>
  String(x ?? "").replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );


const money = n =>
  Number(n || 0).toLocaleString("ar-EG")
  + " ج.م";


/* =========================
   TOAST
========================= */

function toast(msg){

  const t = $("toast");

  t.textContent = msg;

  t.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(
      () => t.classList.remove("show"),
      2200
    );
}


/* =========================
   SHOW DASHBOARD
========================= */

function showDashboard(){

  $("loginPage")
    .classList
    .add("hidden");

  $("dashboardPage")
    .classList
    .remove("hidden");

  $("ownerName").textContent =
    OWNER_USERNAME;

  loadProducts();

  loadCategories();

  loadOrders();

  subscribeToOrders();
}


/* =========================
   SHOW LOGIN
========================= */

function showLogin(){

  $("dashboardPage")
    .classList
    .add("hidden");

  $("loginPage")
    .classList
    .remove("hidden");

}


/* =========================
   LOGIN
========================= */

$("loginForm").addEventListener(
  "submit",
  function(e){

    e.preventDefault();

    const username =
      $("loginUsername")
      .value
      .trim();

    const password =
      $("loginPassword")
      .value;

    const errorBox =
      $("loginError");

    const btn =
      e.currentTarget
      .querySelector(
        "button[type=submit]"
      );

    errorBox.textContent = "";

    btn.disabled = true;

    btn.textContent =
      "جاري الدخول...";


    if(
      username === OWNER_USERNAME &&
      password === OWNER_PASSWORD
    ){

      localStorage.setItem(
        "donut_crush_owner_auth",
        "true"
      );


      $("loginForm").reset();


      btn.disabled = false;

      btn.textContent =
        "دخول لوحة التحكم";


      showDashboard();


    }else{

      errorBox.textContent =
        "اسم المستخدم أو كلمة المرور غير صحيحة.";

      btn.disabled = false;

      btn.textContent =
        "دخول لوحة التحكم";

    }

  }
);


/* =========================
   LOGOUT
========================= */

function logout(){

  localStorage.removeItem(
    "donut_crush_owner_auth"
  );

  $("loginUsername").value = "";

  $("loginPassword").value = "";

  showLogin();
}


/* =========================
   CHECK LOGIN
========================= */

function checkOwnerLogin(){

  const loggedIn =
    localStorage.getItem(
      "donut_crush_owner_auth"
    );

  if(loggedIn === "true"){

    showDashboard();

  }else{

    showLogin();

  }

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  $("products").innerHTML =
    '<div class="empty">جاري تحميل المنتجات...</div>';


  const {
    data,
    error
  } = await db
    .from("Products")
    .select(
      "id,name,description,price,image,available,created_at,category"
    )
    .order(
      "created_at",
      {ascending:false}
    );


  if(error){

    console.error(error);

    $("products").innerHTML =
      `<div class="empty">
        تعذر تحميل المنتجات.
        <br><br>
        راجع صلاحيات جدول Products في Supabase.
      </div>`;

    return;
  }


  products = data || [];

  renderProducts();

}


/* =========================
   LOAD CATEGORIES
========================= */

async function loadCategories(){

  const {
    data,
    error
  } = await db
    .from("Products")
    .select("category");


  if(error){

    console.error(
      "Categories error:",
      error
    );

    return;
  }


  categories = [
    ...new Set(
      (data || [])
        .map(
          x =>
            String(
              x.category || ""
            ).trim()
        )
        .filter(Boolean)
    )
  ];


  renderCategoryOptions();

}


/* =========================
   RENDER CATEGORY OPTIONS
========================= */

function renderCategoryOptions(){

  const select =
    $("productCategory");

  if(!select) return;


  const currentValue =
    select.value;


  select.innerHTML = `

    <option value="">
      اختر التصنيف
    </option>

    ${
      categories
        .map(category => `
          <option value="${esc(category)}">
            ${esc(category)}
          </option>
        `)
        .join("")
    }

    <option value="__new__">
      ➕ إضافة تصنيف جديد
    </option>

  `;


  if(
    currentValue &&
    categories.includes(currentValue)
  ){

    select.value =
      currentValue;

  }

}


/* =========================
   CATEGORY CHANGE
========================= */

$("productCategory").addEventListener(
  "change",
  function(){

    const newInput =
      $("newProductCategory");


    if(this.value === "__new__"){

      newInput.style.display =
        "block";

      newInput.required =
        true;

      newInput.focus();

    }else{

      newInput.style.display =
        "none";

      newInput.required =
        false;

      newInput.value = "";

    }

  }
);


/* =========================
   RENDER PRODUCTS
========================= */

          <span

            ${esc(p.name)}

/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(){

  $("orders").innerHTML =
    '<div class="empty">جاري تحميل الطلبات...</div>';


  const {
    data,
    error
  } = await db
    .from("orders")
    .select(
      "id,customer_name,customer_phone,governorate,area,address,notes,items,total,payment_method,status,created_at"
    )
    .order(
      "created_at",
      {ascending:false}
    );


  if(error){

    console.error(error);

    $("orders").innerHTML =
      `<div class="empty">
        تعذر تحميل الطلبات.
        <br><br>
        راجع صلاحيات جدول orders في Supabase.
      </div>`;

    return;
  }


  orders =
    data || [];

  renderOrders();

}


/* =========================
   RENDER ORDERS
========================= */

function formatOrderDate(value){

  const d =
    new Date(value);

  if(
    Number.isNaN(
      d.getTime()
    )
  ){

    return "";

  }


  return d.toLocaleString(
    "ar-EG",
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );

}


function orderStatusClass(status){

  if(
    status === "تم التسليم" ||
    status === "مكتمل"
  ){

    return "done";

  }


  if(
    status === "ملغي"
  ){

    return "cancelled";

  }


  return "";

}


function renderOrders(){

  const box =
    $("orders");


  if(!orders.length){

    box.innerHTML =
      `<div class="empty">
        📦
        <br><br>
        مفيش طلبات لسه.
      </div>`;

    return;
  }


  box.innerHTML =
    orders.map(o => {

      let items = [];

      try{

        items =
          Array.isArray(o.items)
          ?
          o.items
          :
          JSON.parse(
            o.items || "[]"
          );

      }catch(_){

        items = [];

      }


      const itemRows =
        items
          .map(item => `

            <div class="order-item">

              <span>
                ${esc(item.name || "منتج")}
                ×
                ${esc(
                  item.quantity ??
                  item.qty ??
                  1
                )}
              </span>

              <b>
                ${
                  money(
                    item.subtotal ??
                    (
                      (Number(item.price) || 0) *
                      (
                        Number(
                          item.quantity ??
                          item.qty
                        ) || 1
                      )
                    )
                  )
                }
              </b>

            </div>

          `)
          .join("");


      return `

        <article class="order-card">

          <div class="order-top">

            <div>

              <div class="order-number">
                طلب #${esc(o.id)}
              </div>

              <div class="order-date">
                ${esc(
                  formatOrderDate(
                    o.created_at
                  )
                )}
              </div>

            </div>

            <span
              class="order-status ${orderStatusClass(o.status)}"
            >
              ${esc(
                o.status ||
                "جديد"
              )}
            </span>

          </div>


          <div class="order-body">

            <div>

              <div class="order-label">
                بيانات العميل
              </div>

              <div class="order-value">

                <b>
                  ${esc(
                    o.customer_name
                  )}
                </b>

                <br>

                📞
                ${esc(
                  o.customer_phone
                )}

              </div>

            </div>


            <div>

              <div class="order-label">
                العنوان
              </div>

              <div class="order-value">

                ${esc(
                  o.governorate ||
                  "-"
                )}

                —

                ${esc(
                  o.area ||
                  "-"
                )}

                <br>

                ${esc(
                  o.address ||
                  "-"
                )}

              </div>

            </div>


            <div>

              <div class="order-label">
                الدفع والملاحظات
              </div>

              <div class="order-value">

                💵
                ${esc(
                  o.payment_method ||
                  "عند الاستلام"
                )}

                <br>

                📝
                ${esc(
                  o.notes ||
                  "لا يوجد"
                )}

              </div>

            </div>

          </div>


          <div class="order-items">

            <div class="order-label">
              الطلب
            </div>

            ${
              itemRows ||
              '<div class="order-value">لا توجد تفاصيل منتجات</div>'
            }


            <div class="order-total">

              <span>
                الإجمالي
              </span>

              <span>
                ${money(o.total)}
              </span>

            </div>

          </div>


          <div class="order-actions">

            <select
              onchange="updateOrderStatus('${String(o.id).replace(/'/g,"\\'")}',this.value)"
            >

              ${
                [
                  "جديد",
                  "قيد التجهيز",
                  "خرج للتوصيل",
                  "تم التسليم",
                  "ملغي"
                ]
                .map(st => `
                  <option
                    value="${esc(st)}"
                    ${
                      o.status === st
                      ? "selected"
                      : ""
                    }
                  >
                    ${st}
                  </option>
                `)
                .join("")
              }

            </select>


            <button
              onclick="deleteOrder('${String(o.id).replace(/'/g,"\\'") }')"
            >
              🗑️ حذف الطلب
            </button>

          </div>

        </article>

      `;

    })
    .join("");

}


/* =========================
   UPDATE ORDER STATUS
========================= */

async function updateOrderStatus(
  id,
  status
){

  const {
    error
  } =
    await db
      .from("orders")
      .update({
        status
      })
      .eq(
        "id",
        id
      );


  if(error){

    console.error(error);

    toast(
      "حصل خطأ في تحديث حالة الطلب ❌"
    );

    await loadOrders();

    return;
  }


  toast(
    "تم تحديث حالة الطلب ✅"
  );

  await loadOrders();

}


/* =========================
   DELETE ORDER
========================= */

async function deleteOrder(id){

  if(
    !confirm(
      "هل تريد حذف هذا الطلب نهائيًا؟"
    )
  ){

    return;

  }


  const {
    error
  } =
    await db
      .from("orders")
      .delete()
      .eq(
        "id",
        id
      );


  if(error){

    console.error(error);

    toast(
      "حصل خطأ أثناء حذف الطلب ❌"
    );

    return;
  }


  toast(
    "تم حذف الطلب 🗑️"
  );


  await loadOrders();

}


/* =========================
   REALTIME ORDERS
========================= */

let ordersChannel =
  null;


function subscribeToOrders(){

  if(ordersChannel)
    return;


  ordersChannel =
    db
      .channel(
        "donut-crush-orders"
      )
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"orders"
        },
        () => loadOrders()
      )
      .subscribe();

}


/* =========================
   ADD PRODUCT
========================= */

function openAdd(){

  $("modalTitle").textContent =
    "إضافة منتج";


  $("productForm").reset();


  $("productId").value =
    "";


  $("productAvailable").checked =
    true;


  $("productImage").value =
    "";


  $("productImageFile").value =
    "";


  $("newProductCategory").value =
    "";

  $("newProductCategory").style.display =
    "none";

  $("newProductCategory").required =
    false;


  renderCategoryOptions();


  $("productCategory").value =
    "";


  $("productModal")
    .classList
    .add("show");

}


/* =========================
   EDIT PRODUCT
========================= */

function openEdit(id){

  const p =
    products.find(
      x =>
        String(x.id) ===
        String(id)
    );


  if(!p)
    return;


  $("modalTitle").textContent =
    "تعديل المنتج";


  $("productId").value =
    p.id;


  $("productName").value =
    p.name ||
    "";


  $("productPrice").value =
    p.price ??
    "";


  $("productDescription").value =
    p.description ||
    "";


  $("productImage").value =
    p.image ||
    "";


  $("productImageFile").value =
    "";


  renderCategoryOptions();


  const existingCategory =
    String(
      p.category ||
      ""
    ).trim();


  if(
    existingCategory &&
    categories.includes(
      existingCategory
    )
  ){

    $("productCategory").value =
      existingCategory;


    $("newProductCategory").value =
      "";

    $("newProductCategory").style.display =
      "none";

    $("newProductCategory").required =
      false;

  }else if(existingCategory){

    $("productCategory").value =
      "__new__";


    $("newProductCategory").value =
      existingCategory;


    $("newProductCategory").style.display =
      "block";

    $("newProductCategory").required =
      true;

  }else{

    $("productCategory").value =
      "";

    $("newProductCategory").value =
      "";

    $("newProductCategory").style.display =
      "none";

    $("newProductCategory").required =
      false;

  }


  $("productAvailable").checked =
    p.available !== false;


  $("productModal")
    .classList
    .add("show");

}


/* =========================
   CLOSE MODAL
========================= */

function closeModal(){

  $("productModal")
    .classList
    .remove("show");

}


/* =========================
   SAVE PRODUCT
========================= */

$("productForm").addEventListener(
  "submit",
  async function(e){

    e.preventDefault();


    const btn =
      $("saveProduct");


    btn.disabled =
      true;

    btn.textContent =
      "جاري الحفظ...";


    const id =
      $("productId")
        .value
        .trim();


    /* CATEGORY */

    let selectedCategory =
      $("productCategory")
        .value;


    if(
      selectedCategory ===
      "__new__"
    ){

      selectedCategory =
        $("newProductCategory")
          .value
          .trim();

    }


    if(!selectedCategory){

      toast(
        "اختار تصنيف المنتج أولاً"
      );


      btn.disabled =
        false;

      btn.textContent =
        "حفظ المنتج";

      return;

    }


    /* PAYLOAD */

    const payload = {

      name:
        $("productName")
          .value
          .trim(),

      description:
        $("productDescription")
          .value
          .trim(),

      price:
        Number(
          $("productPrice")
            .value
        ),

      image:
        $("productImage")
          .value
          .trim(),

      category:
        selectedCategory,

      available:
        $("productAvailable")
          .checked

    };


    let result;


    if(id){

      result =
        await db
          .from("Products")
          .update(payload)
          .eq(
            "id",
            id
          );

    }else{

      result =
        await db
          .from("Products")
          .insert(
            payload
          );

    }


    if(result.error){

      console.error(
        result.error
      );


      toast(
        "حصل خطأ أثناء حفظ المنتج"
      );


      btn.disabled =
        false;

      btn.textContent =
        "حفظ المنتج";

      return;
    }


    /* ADD NEW CATEGORY LOCALLY */

    if(
      !categories.includes(
        selectedCategory
      )
    ){

      categories.push(
        selectedCategory
      );

    }


    closeModal();


    toast(
      id
      ?
      "تم تعديل المنتج بنجاح ✅"
      :
      "تمت إضافة المنتج بنجاح ✅"
    );


    await loadProducts();

    await loadCategories();


    btn.disabled =
      false;

    btn.textContent =
      "حفظ المنتج";

  }
);


/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(id){

  const p =
    products.find(
      x =>
        String(x.id) ===
        String(id)
    );


  if(!p)
    return;


  if(
    !confirm(
      `هل تريد حذف "${p.name}" نهائياً؟`
    )
  ){

    return;

  }


  const {
    error
  } =
    await db
      .from("Products")
      .delete()
      .eq(
        "id",
        id
      );


  if(error){

    console.error(error);

    toast(
      "حصل خطأ أثناء حذف المنتج"
    );

    return;
  }


  toast(
    "تم حذف المنتج 🗑️"
  );


  await loadProducts();

  await loadCategories();

}

   CLOSE MODAL WHEN CLICK OUTSIDE

    if(
