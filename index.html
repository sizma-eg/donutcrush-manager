<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Donut Crush | Owner Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --pink:#f28aa6;
  --pink2:#ffe8ef;
  --cream:#fffaf7;
  --brown:#432b29;
  --muted:#927875;
  --line:#f0e3df;
  --white:#fff;
  --danger:#d9566d;
  --green:#39a56f
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--cream);
  color:var(--brown);
  font-family:Tahoma,Arial,sans-serif
}

button,input,textarea,select{
  font:inherit
}

button{
  cursor:pointer
}

.container{
  width:min(1120px,calc(100% - 28px));
  margin:auto
}

.hidden{
  display:none!important
}

/* Login */

.login-page{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px
}

.login-box{
  width:min(420px,100%);
  background:#fff;
  border:1px solid var(--line);
  border-radius:25px;
  padding:30px;
  box-shadow:0 20px 60px #5a322b12
}

.logo{
  width:58px;
  height:58px;
  border-radius:18px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#ffb6c9,#ef7295);
  font-size:30px;
  margin:0 auto 15px
}

.login-box h1{
  text-align:center;
  margin:0 0 7px;
  font-size:24px
}

.login-box>p{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin:0 0 25px
}

.field{
  margin-bottom:13px
}

.field label{
  display:block;
  font-size:11px;
  color:#806d68;
  margin-bottom:6px
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid var(--line);
  border-radius:11px;
  padding:12px;
  outline:0;
  background:#fff;
  color:var(--brown)
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:#f4a5b9;
  box-shadow:0 0 0 3px var(--pink2)
}

.submit{
  width:100%;
  height:46px;
  border:0;
  border-radius:13px;
  background:var(--pink);
  color:#fff;
  font-weight:bold
}

.error{
  color:var(--danger);
  font-size:11px;
  text-align:center;
  min-height:18px;
  margin:10px 0
}

/* Dashboard */

header{
  background:#fff;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  z-index:20
}

.nav{
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900
}

.brand-logo{
  width:42px;
  height:42px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:var(--pink2);
  font-size:22px
}

.owner{
  display:flex;
  align-items:center;
  gap:10px
}

.owner-email{
  font-size:10px;
  color:var(--muted);
  max-width:220px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.logout{
  border:1px solid var(--line);
  background:#fff;
  color:var(--danger);
  border-radius:11px;
  padding:9px 12px;
  font-size:10px;
  font-weight:bold
}

main{
  padding:30px 0 60px
}

.top{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px
}

.top h1{
  margin:0;
  font-size:28px
}

.top p{
  margin:7px 0 0;
  color:var(--muted);
  font-size:11px
}

.add-btn{
  border:0;
  background:var(--pink);
  color:#fff;
  border-radius:12px;
  padding:12px 17px;
  font-weight:bold;
  font-size:11px
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-bottom:20px
}

.stat{
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  padding:16px
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-bottom:7px
}

.stat b{
  font-size:22px
}

.products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:19px;
  overflow:hidden;
  display:flex;
  flex-direction:column
}

.pic{
  height:190px;
  background:linear-gradient(135deg,#ffe1e9,#fff0df);
  display:grid;
  place-items:center;
  overflow:hidden;
  position:relative
}

.pic img{
  width:100%;
  height:100%;
  object-fit:cover
}

.emoji{
  font-size:65px
}

.status{
  position:absolute;
  top:10px;
  right:10px;
  padding:6px 9px;
  border-radius:20px;
  font-size:9px;
  font-weight:bold;
  background:#e7f8ef;
  color:#27845b
}

.status.off{
  background:#fcebed;
  color:var(--danger)
}

.info{
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:7px;
  flex:1
}

.info h3{
  margin:0;
  font-size:15px
}

.desc{
  margin:0;
  color:var(--muted);
  font-size:10px;
  line-height:1.7;
  min-height:34px
}

.meta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:auto;
  padding-top:7px
}

.price{
  font-weight:900;
  color:#df5e80;
  font-size:15px
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:9px
}

.edit,
.delete{
  border:0;
  border-radius:10px;
  padding:9px;
  font-size:10px;
  font-weight:bold
}

.edit{
  background:var(--pink2);
  color:#d65d7b
}

.delete{
  background:#fcebed;
  color:var(--danger)
}

.empty{
  grid-column:1/-1;
  text-align:center;
  background:#fff;
  border:1px dashed #e9d5d0;
  border-radius:18px;
  padding:55px;
  color:var(--muted);
  font-size:12px
}

/* Modal */

.modal{
  position:fixed;
  inset:0;
  background:#2e1c1b88;
  z-index:50;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px
}

.modal.show{
  display:flex
}

.modal-box{
  width:min(560px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:23px;
  padding:22px
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px
}

.modal-head h2{
  margin:0;
  font-size:19px
}

.close{
  border:0;
  background:#f7eeee;
  width:35px;
  height:35px;
  border-radius:10px
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.full{
  grid-column:1/-1
}

.check{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:11px;
  color:var(--muted);
  margin:5px 0 13px
}

.check input{
  width:auto
}

.toast{
  position:fixed;
  bottom:20px;
  right:20px;
  z-index:100;
  background:var(--brown);
  color:#fff;
  padding:12px 17px;
  border-radius:12px;
  font-size:11px;
  opacity:0;
  transform:translateY(10px);
  transition:.2s
}

.toast.show{
  opacity:1;
  transform:none
}

@media(max-width:850px){
  .products{
    grid-template-columns:repeat(2,1fr)
  }
}

@media(max-width:600px){

  .container{
    width:min(100% - 20px,1120px)
  }

  .owner-email{
    display:none
  }

  .top{
    align-items:stretch;
    flex-direction:column
  }

  .add-btn{
    width:100%
  }

  .products{
    grid-template-columns:1fr
  }

  .stats{
    grid-template-columns:1fr 1fr
  }

  .form-grid{
    grid-template-columns:1fr
  }

  .full{
    grid-column:auto
  }
}
</style>
</head>

<body>

<section id="loginPage" class="login-page">

  <div class="login-box">

    <div class="logo">🍩</div>

    <h1>Donut Crush</h1>

    <p>Owner Dashboard — تسجيل دخول المالك</p>

    <form id="loginForm">

      <div class="field">

        <label>البريد الإلكتروني</label>

        <input
          id="loginEmail"
          type="email"
          autocomplete="email"
          required
          placeholder="owner@example.com"
        >

      </div>

      <div class="field">

        <label>كلمة المرور</label>

        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          required
          placeholder="••••••••"
        >

      </div>

      <div id="loginError" class="error"></div>

      <button class="submit" type="submit">
        دخول لوحة التحكم
      </button>

    </form>

  </div>

</section>


<div id="dashboardPage" class="hidden">

<header>

  <div class="container nav">

    <div class="brand">
      <span class="brand-logo">🍩</span>
      Donut Crush Dashboard
    </div>

    <div class="owner">

      <span id="ownerEmail" class="owner-email"></span>

      <button class="logout" onclick="logout()">
        تسجيل الخروج
      </button>

    </div>

  </div>

</header>


<main>

  <div class="container">

    <div class="top">

      <div>

        <h1>إدارة المنتجات</h1>

        <p>
          إضافة وتعديل وحذف المنتجات من قاعدة البيانات.
        </p>

      </div>

      <button class="add-btn" onclick="openAdd()">
        ＋ إضافة منتج
      </button>

    </div>


    <div class="stats">

      <div class="stat">
        <span>إجمالي المنتجات</span>
        <b id="totalProducts">0</b>
      </div>

      <div class="stat">
        <span>المنتجات المتاحة</span>
        <b id="availableProducts">0</b>
      </div>

    </div>


    <div id="products" class="products"></div>

  </div>

</main>

</div>


<div id="productModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modalTitle">
        إضافة منتج
      </h2>

      <button class="close" onclick="closeModal()">
        ✕
      </button>

    </div>


    <form id="productForm">

      <input id="productId" type="hidden">


      <div class="form-grid">

        <div class="field">

          <label>اسم المنتج *</label>

          <input
            id="productName"
            required
            maxlength="100"
            placeholder="Chocolate Donut"
          >

        </div>


        <div class="field">

          <label>السعر *</label>

          <input
            id="productPrice"
            type="number"
            min="0"
            step="0.01"
            required
            placeholder="50"
          >

        </div>


        <div class="field full">

          <label>الوصف</label>

          <textarea
            id="productDescription"
            maxlength="300"
            placeholder="وصف المنتج"
          ></textarea>

        </div>


        <div class="field">

          <label>رابط الصورة</label>

          <input
            id="productImage"
            type="url"
            placeholder="https://..."
          >

        </div>


        <div class="field">

          <label>التصنيف</label>

          <select id="productCategory">

            <option value="">اختر التصنيف</option>

            <option value="شيكولاتة">🍫 شيكولاتة</option>

            <option value="لوتس">🍪 لوتس</option>

            <option value="فراولة">🍓 فراولة</option>

            <option value="كلاسيك">🤎 كلاسيك</option>

            <option value="كيندر">🍫 كيندر</option>

            <option value="كراميل">🍯 كراميل</option>

            <option value="اوريو">🍪 أوريو</option>

            <option value="مخصوص">⭐ مخصوص</option>

            <option value="__new__">➕ إضافة تصنيف جديد</option>

          </select>

        </div>


        <div
          class="field full"
          id="newCategoryField"
          style="display:none"
        >

          <label>اسم التصنيف الجديد</label>

          <input
            id="newProductCategory"
            maxlength="60"
            placeholder="اكتب اسم التصنيف الجديد"
          >

        </div>

      </div>


      <label class="check">

        <input
          id="productAvailable"
          type="checkbox"
          checked
        >

        المنتج متاح للعميل

      </label>


      <button
        id="saveProduct"
        class="submit"
        type="submit"
      >
        حفظ المنتج
      </button>

    </form>

  </div>

</div>


<div id="toast" class="toast"></div>


<script>

const SUPABASE_URL="https://euvcfvsejcsoympamjub.supabase.co";

const SUPABASE_KEY="sb_publishable_hct8gjRVMCj2L59vI46Yag_VuXReOdU";

const db=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let products=[];

const $=id=>document.getElementById(id);

const esc=x=>String(x??"").replace(
  /[&<>"']/g,
  m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[m])
);

const money=n=>
  Number(n||0).toLocaleString("ar-EG")+" ج.م";


function toast(msg){

  const t=$("toast");

  t.textContent=msg;

  t.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(
    ()=>t.classList.remove("show"),
    2200
  );

}


function showDashboard(user){

  $("loginPage").classList.add("hidden");

  $("dashboardPage").classList.remove("hidden");

  $("ownerEmail").textContent=
    user?.email||"Owner";

  loadProducts();

}


async function checkSession(){

  const {
    data:{session}
  }=await db.auth.getSession();

  if(session?.user){

    showDashboard(session.user);

  }else{

    $("loginPage").classList.remove("hidden");

    $("dashboardPage").classList.add("hidden");

  }

}


$("loginForm").addEventListener(
  "submit",
  async e=>{

    e.preventDefault();

    const errorBox=$("loginError");

    const btn=e.currentTarget.querySelector(
      "button[type=submit]"
    );

    errorBox.textContent="";

    btn.disabled=true;

    btn.textContent="جاري الدخول...";


    const {data,error}=
      await db.auth.signInWithPassword({

        email:$("loginEmail").value.trim(),

        password:$("loginPassword").value

      });


    if(error){

      errorBox.textContent=
        "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

      btn.disabled=false;

      btn.textContent="دخول لوحة التحكم";

      return;

    }


    btn.disabled=false;

    btn.textContent="دخول لوحة التحكم";

    showDashboard(data.user);

  }
);


async function logout(){

  await db.auth.signOut();

  $("dashboardPage").classList.add("hidden");

  $("loginPage").classList.remove("hidden");

  $("loginPassword").value="";

}


db.auth.onAuthStateChange(
  (_event,session)=>{

    if(session?.user){

      $("loginPage").classList.add("hidden");

      $("dashboardPage").classList.remove("hidden");

      $("ownerEmail").textContent=
        session.user.email||"Owner";

    }else{

      $("dashboardPage").classList.add("hidden");

      $("loginPage").classList.remove("hidden");

    }

  }
);


async function loadProducts(){

  $("products").innerHTML=
    '<div class="empty">جاري تحميل المنتجات...</div>';


  const {data,error}=
    await db
      .from("Products")
      .select(
        "id,name,description,price,image,available,created_at,category"
      )
      .order(
        "created_at",
        {ascending:false}
      );


  if(error){

    console.error(error);

    $("products").innerHTML=
      '<div class="empty">تعذر تحميل المنتجات.<br>راجع صلاحيات جدول Products في Supabase.</div>';

    return;

  }


  products=data||[];

  renderProducts();

}


function renderProducts(){

  $("totalProducts").textContent=
    products.length;

  $("availableProducts").textContent=
    products.filter(
      p=>p.available!==false
    ).length;


  if(!products.length){

    $("products").innerHTML=
      '<div class="empty">🍩<br><br>لا توجد منتجات حتى الآن.</div>';

    return;

  }


  $("products").innerHTML=
    products.map(p=>`

      <article class="card">

        <div class="pic">

          ${
            p.image
            ?
            `<img
              src="${esc(p.image)}"
              alt="${esc(p.name)}"
              onerror="this.style.display='none'"
            >`
            :
            `<span class="emoji">🍩</span>`
          }

          <span class="status ${p.available===false?"off":""}">
            ${p.available===false?"غير متاح":"متاح"}
          </span>

        </div>


        <div class="info">

          <h3>
            ${esc(p.name)}
          </h3>

          <p class="desc">
            ${esc(p.description||"بدون وصف")}
          </p>


          <div class="meta">

            <span class="price">
              ${money(p.price)}
            </span>

            <span
              style="font-size:9px;color:#927875"
            >
              ${esc(p.category||"دونات")}
            </span>

          </div>


          <div class="actions">

            <button
              class="edit"
              onclick="openEdit('${String(p.id).replace(/'/g,"\\'")}')"
            >
              ✏️ تعديل
            </button>


            <button
              class="delete"
              onclick="deleteProduct('${String(p.id).replace(/'/g,"\\'")}')"
            >
              🗑️ حذف
            </button>

          </div>

        </div>

      </article>

    `).join("");

}


function openAdd(){

  $("modalTitle").textContent=
    "إضافة منتج";

  $("productForm").reset();

  $("productId").value="";

  $("productAvailable").checked=true;

  $("newCategoryField").style.display="none";

  $("newProductCategory").value="";

  $("productModal").classList.add("show");

}


function openEdit(id){

  const p=products.find(
    x=>String(x.id)===String(id)
  );

  if(!p)return;


  $("modalTitle").textContent=
    "تعديل المنتج";

  $("productId").value=p.id;

  $("productName").value=p.name||"";

  $("productPrice").value=
    p.price??"";

  $("productDescription").value=
    p.description||"";

  $("productImage").value=
    p.image||"";


  const categories=[
    "شيكولاتة",
    "لوتس",
    "فراولة",
    "كلاسيك",
    "كيندر",
    "كراميل",
    "اوريو",
    "مخصوص"
  ];


  if(categories.includes(p.category)){

    $("productCategory").value=
      p.category;

    $("newCategoryField").style.display=
      "none";

    $("newProductCategory").value="";

  }else{

    $("productCategory").value=
      "__new__";

    $("newCategoryField").style.display=
      "block";

    $("newProductCategory").value=
      p.category||"";

  }


  $("productAvailable").checked=
    p.available!==false;

  $("productModal").classList.add("show");

}


function closeModal(){

  $("productModal").classList.remove("show");

}


$("productCategory").addEventListener(
  "change",
  function(){

    if(this.value==="__new__"){

      $("newCategoryField").style.display=
        "block";

      $("newProductCategory").focus();

    }else{

      $("newCategoryField").style.display=
        "none";

      $("newProductCategory").value="";

    }

  }
);


$("productForm").addEventListener(
  "submit",
  async e=>{

    e.preventDefault();

    const btn=$("saveProduct");

    btn.disabled=true;

    btn.textContent="جاري الحفظ...";


    const id=$("productId").value.trim();


    let category=
      $("productCategory").value.trim();


    if(category==="__new__"){

      category=
        $("newProductCategory")
          .value
          .trim();

    }


    const payload={

      name:
        $("productName")
          .value
          .trim(),

      description:
        $("productDescription")
          .value
          .trim(),

      price:
        Number(
          $("productPrice").value
        ),

      image:
        $("productImage")
          .value
          .trim(),

      category:
        category||"شيكولاتة",

      available:
        $("productAvailable")
          .checked

    };


    let result;


    if(id){

      result=
        await db
          .from("Products")
          .update(payload)
          .eq("id",id);

    }else{

      result=
        await db
          .from("Products")
          .insert(payload);

    }


    if(result.error){

      console.error(result.error);

      toast(
        "حصل خطأ أثناء حفظ المنتج"
      );

      btn.disabled=false;

      btn.textContent=
        "حفظ المنتج";

      return;

    }


    closeModal();

    toast(
      id
      ?
      "تم تعديل المنتج بنجاح ✅"
      :
      "تمت إضافة المنتج بنجاح ✅"
    );


    await loadProducts();


    btn.disabled=false;

    btn.textContent=
      "حفظ المنتج";

  }
);


async function deleteProduct(id){

  const p=products.find(
    x=>String(x.id)===String(id)
  );

  if(!p)return;


  if(
    !confirm(
      `هل تريد حذف "${p.name}" نهائياً؟`
    )
  )return;


  const {error}=
    await db
      .from("Products")
      .delete()
      .eq("id",id);


  if(error){

    console.error(error);

    toast(
      "حصل خطأ أثناء حذف المنتج"
    );

    return;

  }


  toast(
    "تم حذف المنتج 🗑️"
  );

  await loadProducts();

}


checkSession();

</script>

</body>
</html>
